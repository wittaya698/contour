model: smoke
description: >
  Pipeline fixture: a plinth, a pillar and a sphere. It exists only to exercise
  every stage of ./contour in seconds. Never a deliverable. Deliberately
  asymmetric (120 wide, 100 deep) so an axis swap in export shows up.

targets:
  - web

dimensions:
  height: { value: 200, tol: 1 }
  width:  { value: 120, tol: 1 }
  depth:  { value: 100, tol: 1 }

# The rig hangs from the cap, not the plinth: a root has no pivot to sit on,
# so the cap keeps its origin at its sphere's centre, which the fixture's
# anchor tests measure from (tests/test_fixture.py).
parts:
  - { name: plinth, count: 1, parent: pillar }
  - { name: pillar, count: 1, parent: cap }
  - { name: cap,    count: 1 }

topology:
  tri_budget: 2000
  quads_min_pct: 90
  ngons_allowed: false
  manifold: required
  loose_geometry: forbidden
  normals: outward
  doubles_tolerance_mm: 0.01

uv:
  required: false

materials:
  max_slots: 2
  names: [stone, accent]

transform:
  origin: base_center
  scale_applied: true
  rotation_applied: true
  up_axis: Z
  pivot_tolerance_mm: 1
