# Contour spec schema — the shape of a model space's spec.yaml
#
# THE SPEC IS THE USER'S INTENT. An agent drafts one when asked, and may revise
# one only after the user confirms the change (ADR 0002, ADR 0016).
# verify.py reads this file's structure to know what to enforce.
#
# Every field below is annotated with: who sets it, whether verify.py can check
# it mechanically, and what a violation means.

model: <name>                # must equal the model space's directory name

# ---------------------------------------------------------------- revision
# Optional. Counts accepted changes to this contract; absent means 0, so a spec
# written before ADR 0016 needs nothing until its first revision.
#
# `contour check` compares this file against HEAD's copy: changed content with
# no increment is a HARD FAIL. That is the whole mechanism behind "the agent
# may revise the spec, but never quietly" — bump it only when the user has
# confirmed the change, in the same write that makes it.
#
# NOT a release version. The release is a folder and a tag (ADR 0013); the two
# move at different rates and fusing them makes one of them lie.
# revision: 1
description: >               # prose. NOT machine-checkable; judged by the human at the gate.
  One or two sentences of what this thing is.

# ---------------------------------------------------------------- engine target
# Which engines this asset must import cleanly into. Only `web` is implemented
# (ADR 0006). Adding a target = adding an entry here plus its transform in lib/.
targets:
  - web                      # glTF 2.0 .glb — Y-up, right-handed, metres
  # - unity                  # FBX — Y-up, left-handed, 1 unit = 1 m
  # - ue                     # FBX — Z-up, left-handed, 1 uu = 1 cm (scale x100)

# ---------------------------------------------------------------- dimensions
# Millimetres, always. Measured on the built mesh's bounding box, and again on
# the round-tripped export. A miss is a HARD FAIL.
dimensions:
  height:  { value: 0, tol: 2 }
  width:   { value: 0, tol: 2 }
  depth:   { value: 0, tol: 2 }
  # Named sub-measurements are optional and measured per named part:
  # seat_height: { value: 450, tol: 3, part: seat }

# ---------------------------------------------------------------- parts
# Every object the build must produce, by exact name. verify.py fails on a
# missing part, an unexpected extra part, or a naming mismatch.
parts:
  - name: <part-name>
    count: 1                 # e.g. 4 for legs; verify counts instances
    # notes: prose, human-judged only
    # parent: <part-name>    # the rig (ADR 0023): the part this one hangs from.
    #                        # Optional; a spec with no parent anywhere has no rig.
    #                        # With one, exactly one part has no parent (the root),
    #                        # every parent names a part, there is no cycle, and a
    #                        # rigged part has count 1 — one bone per part.

# ---------------------------------------------------------------- topology
# The game-asset constraints. All mechanically checkable.
topology:
  tri_budget: 0              # HARD FAIL above this triangle count
  quads_min_pct: 90          # % of faces that must be quads (subdiv/deform friendliness)
  ngons_allowed: false       # faces with >4 verts
  manifold: required         # required | not_required
  loose_geometry: forbidden  # stray verts/edges not belonging to a face
  normals: outward           # verify recomputes and compares
  doubles_tolerance_mm: 0.01 # verts closer than this are a fail (unwelded geometry)

# ---------------------------------------------------------------- uv
uv:
  required: true
  overlap_allowed: false     # overlapping islands break lightmaps/baking
  # udim: false

# ---------------------------------------------------------------- materials
materials:
  max_slots: 2               # engine draw-call budget
  names: []                  # optional exact slot names to enforce

# ---------------------------------------------------------------- transform
# The commonest source of "the model is broken in my engine".
transform:
  origin: base_center        # base_center | world_origin | bbox_center
  scale_applied: true        # object scale must be 1,1,1 on export
  rotation_applied: true     # object rotation must be 0,0,0 on export
  up_axis: Z                 # Blender-native; per-target conversion happens at export
  # pivot_tolerance_mm: 1    # required once any part has a parent: how far a
  #                          # part's origin may sit from the centre of its seam
  #                          # with its parent (ADR 0023). The user's number.

# ---------------------------------------------------------------- clips
# Animation, keyed onto the rig by kit.rig() from these numbers alone (ADR
# 0023). Needs a rig: parts with parent:. Optional; a spec with none has none.
# clips:
#   walk:                    # the clip's name, which the .glb carries
#     feel: "toy-like, on the spot"   # the user's word; judged by eye at the
#                            # checkpoint, checked by nothing
#     frames: 30             # how many frames the clip spans
#     fps: 30
#     loop: true             # the frame at `frames` is key 0 again — implied,
#                            # never written; keys run 0..frames-1
#     keys:                  # key poses, by frame from 0
#       0:  { leg_L: [25, 0, 0], leg_R: [-25, 0, 0] }
#       15: { leg_L: [-25, 0, 0], leg_R: [25, 0, 0] }
#                            # [x, y, z] degrees about the model's X, Y, Z, in
#                            # the parent's frame, from rest, applied X then Y
#                            # then Z. A key pose is the whole pose: a part it
#                            # does not name is at rest in it.
#     tol_deg: 2             # required: how far a keyed bone may read off its
#                            # key, and a loop's last frame off its first. The
#                            # user's number.

# ---------------------------------------------------------------- render
# Checkpoint sheet settings. Defaults live in lib/ — override only if the
# subject needs it (e.g. a very tall object needs a different framing).
render:
  grid_metres: 1
  sheet_resolution: 1024

# ---------------------------------------------------------------- notes
# Prose intent that cannot be measured. verify.py ignores these; the human
# approval gate is where they are judged. Keep them short and specific.
notes:
  - ""
