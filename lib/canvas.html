<!doctype html>
<meta charset="utf-8">
<title>contour canvas</title>
<style>
  :root { color-scheme: light dark; --ink: #1b1b1b; --bg: #f4f4f2; --line: #c9c7c0; --pin: #d8442f; --agent: #2f6fd8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e6e0; --bg: #17181a; --line: #3a3c40; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
         color: var(--ink); background: var(--bg); }
  #stage { flex: 1; position: relative; overflow: auto; padding: 12px; }
  #wrap { position: relative; display: inline-block; }
  canvas { display: block; max-width: 100%; height: auto; cursor: crosshair; }
  aside { width: 300px; border-left: 1px solid var(--line); padding: 16px; display: flex;
          flex-direction: column; gap: 12px; overflow: auto; }
  h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0; opacity: .6; }
  ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  li::marker { color: var(--pin); font-weight: 700; }
  li.closed::marker { color: var(--line); }
  .view { opacity: .55; font-size: 12px; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input, button { font: inherit; padding: 7px 9px; border: 1px solid var(--line);
                  border-radius: 6px; background: transparent; color: inherit; }
  button { cursor: pointer; }
  #done { border-color: var(--pin); color: var(--pin); }
  #hint { opacity: .6; font-size: 12px; }
  .pin { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px;
         border-radius: 50%; background: var(--pin); color: #fff; font-size: 11px;
         font-weight: 700; display: grid; place-items: center; pointer-events: none; }
  /* A ref mark points at the user's intent, not at our build, and the two must
     never be misread for one another. Shape, not colour: it still reads on a
     photograph of any hue, and in greyscale. */
  .pin.ref { border-radius: 2px; }
  /* Shape says what a mark points at; colour says who wrote it. The two are
     independent, so no combination of them is ambiguous. */
  .pin.agent { background: var(--agent); }
  li.agent::marker { color: var(--agent); }
  /* Addressed: the agent believes it has done something about the question.
     Not a close — the finding stands until the user says otherwise, so this
     dims the badge and never removes it. */
  .pin.done { opacity: .4; }
  li.done .text { opacity: .55; }
  .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
         opacity: .6; color: var(--agent); }
  li.ref::marker { content: "\25A0  "; }
  /* A span's far end: the same square, unnumbered. The line between them is
     stroked on the canvas itself, because it has to sit under the pins and
     scale with the picture. */
  .pin.end { width: 12px; height: 12px; margin: -6px 0 0 -6px; }
  /* The strip: the sheet, then the user's references. One canvas, one at a time. */
  #strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #strip button { padding: 4px 10px; font-size: 12px; opacity: .65; }
  #strip button.on { opacity: 1; border-color: var(--pin); color: var(--pin); }
  /* A closed mark stays on the sheet and stops shouting: hollow, not gone. */
  .pin.closed { background: transparent; border: 1.5px solid var(--line); color: var(--line); }
  li.closed { opacity: .45; text-decoration: line-through; }
  .part { opacity: .8; font-size: 12px; font-weight: 600; }
  .shut { border: 0; padding: 0 0 0 6px; font-size: 12px; opacity: .6; text-decoration: underline; }
  /* The run, when the host is one that owns a build. Above the ending, because
     the ending is what you reach for last. */
  #run { border-top: 1px solid var(--line); padding-top: 12px; display: flex;
         flex-direction: column; gap: 8px; }
  #state { opacity: .6; font-size: 12px; }
  #end { border-color: var(--pin); color: var(--pin); }
  /* Until the host has answered, nothing that depends on the answer is on
     screen. `/can` is a request, and a page painted before it lands offers the
     launcher the console's panel and the console the canvas's ending — each
     host briefly showing the other's surface. `!important` because these
     elements carry ids, and an id's own `display` would otherwise win. */
  body:not(.asked) [data-needs],
  body:not(.asked) [data-unless] { display: none !important; }
</style>
<div id="stage"><div id="strip"></div><div id="wrap"><canvas id="sheet"></canvas></div></div>
<aside>
  <h1>Marks</h1>
  <ol id="list"></ol>
  <p id="hint">Click the sheet, then type one line.</p>
  <form id="entry" hidden>
    <span class="view" id="where"></span>
    <input id="text" placeholder="what is wrong here" autocomplete="off">
    <button type="submit">Add mark</button>
  </form>
  <!-- One page, two hosts (ADR 0019). An element says which capability it
       needs, or which one it stands in for when the host lacks it, and one rule
       below applies every such declaration. The alternative was a page per host,
       which is how the sheet ends up being marked on one surface and watched on
       another. -->
  <section id="run" data-needs="drive">
    <h1>Run</h1>
    <p id="state">no run yet</p>
    <button id="end" data-closed="Run ended">End run</button>
  </section>
  <button id="done" data-unless="drive" data-closed="Canvas closed">Done</button>
</aside>
<script>
// This session's token, from the URL the command opened (ADR 0019). Localhost
// is not a boundary for a server that takes POSTs, so every request carries it.
const TOKEN = new URLSearchParams(location.search).get('t') || '';

// One place, so there is one place to get it wrong. A fetch sends the token as
// a header, which makes the request non-simple and therefore unreachable from
// another site without a preflight the server refuses; a body makes it a POST
// and declares JSON, which is the content type the server insists on.
function ask(path, body) {
  const init = { headers: { 'X-Contour-Token': TOKEN } };
  if (body !== undefined) {
    init.method = 'POST';
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  return fetch(path, init);
}

// An <img src> cannot carry a header, so a picture carries the token in the
// query. Safe: fetching one changes nothing.
function asset(path) {
  return path + (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(TOKEN);
}
// What this host can do. One request, one rule: an element declaring a
// capability the host lacks is removed, and an element declaring what it stands
// in for is removed when the host *has* that capability. So the launcher's
// ending is Done and the console's is End run, from the same markup.
//
// A name nobody knows here matches no element and does nothing. That is
// deliberate: `/can` is written by us, so an unrecognised name in it is our bug
// and not something to put in front of the user (`lib/policy.py` reports the
// strangers in the ask-list for the opposite reason — the user wrote that one).
ask('/can').then(r => r.json()).then(({ can }) => {
  const has = new Set(can);
  for (const el of document.querySelectorAll('[data-needs]'))
    if (!has.has(el.dataset.needs)) el.remove();
  for (const el of document.querySelectorAll('[data-unless]'))
    if (has.has(el.dataset.unless)) el.remove();
  document.body.classList.add('asked');     // what survived may now be seen
});

const cv = document.getElementById('sheet'), ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap'), list = document.getElementById('list');
const entry = document.getElementById('entry'), text = document.getElementById('text');
const where = document.getElementById('where'), hint = document.getElementById('hint');
const strip = document.getElementById('strip');
let marks = [], pending = null, added = 0, parts = {};
// Where a drag started, in picture pixels. A drag on a reference is a *span*:
// two ends that mean one distance, which is the only way a picture can be
// asked about a separation (ADR 0018).
let down = null;
// null means the sheet; otherwise the name of the reference on show. Only one
// picture is ever displayed, so only its own marks are ever pinned to it.
let showing = null;

// The mask is read here, never fetched per mouse move: hover has to be instant.
// It is the same size and the same four-tile layout as the sheet, so a sheet
// pixel and a mask pixel are the same pixel.
const mk = document.createElement('canvas');
const mctx = mk.getContext('2d', { willReadFrequently: true });
const maskImg = new Image();
maskImg.onload = () => { mk.width = maskImg.width; mk.height = maskImg.height;
                         mctx.drawImage(maskImg, 0, 0); };
maskImg.onerror = () => {};   // a space rendered before masks existed: no hover
maskImg.src = asset('/mask.png?' + Date.now());
ask('/parts.json').then(r => r.json()).then(t => parts = t);

const img = new Image();
img.onload = () => { cv.width = img.width; cv.height = img.height;
                     ctx.clearRect(0, 0, cv.width, cv.height);
                     ctx.drawImage(img, 0, 0); draw(); };

function show(name) {
  showing = name;
  pending = null;
  entry.hidden = true;
  for (const b of strip.children) b.classList.toggle('on', (b.dataset.ref || null) === name);
  text.placeholder = name ? 'here is what I meant' : 'what is wrong here';
  hint.textContent = name ? 'Click the reference, or drag across a distance.'
                          : 'Click the sheet, then type one line.';
  img.src = asset(name ? '/ref?name=' + encodeURIComponent(name)
                       : '/sheet.png?' + Date.now());
}

// A space with no references gets a strip with the sheet alone, which is the
// canvas it has always been.
ask('/refs.json').then(r => r.json()).then(names => {
  for (const name of [null, ...names]) {
    const b = document.createElement('button');
    b.textContent = name || 'sheet';
    if (name) b.dataset.ref = name;
    b.addEventListener('click', () => show(name));
    strip.appendChild(b);
  }
  show(null);
});

// Marks outlive the session that made them, so the page starts from the file.
ask('/marks').then(r => r.json()).then(on => { marks = on; draw(); });

// Sheet layout, from contour render: front | right over top | persp.
function viewAt(x, y) {
  const left = x < cv.width / 2, upper = y < cv.height / 2;
  return upper ? (left ? 'front' : 'right') : (left ? 'top' : 'persp');
}

// Index 0 is background, and background is not a part: a click on the gap is a
// remark about the gap, never about whatever happens to be beside it.
function partAt(x, y) {
  if (!mk.width) return null;
  return parts[mctx.getImageData(x, y, 1, 1).data[0]] || null;
}

function at(e) {
  const r = cv.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * cv.width / r.width),
          Math.round((e.clientY - r.top) * cv.height / r.height)];
}

function draw() {
  for (const old of wrap.querySelectorAll('.pin')) old.remove();
  // The picture goes back down first: a span is stroked onto the canvas, so
  // last draw's lines have to be painted over rather than accumulated.
  if (cv.width && img.complete) { ctx.clearRect(0, 0, cv.width, cv.height);
                                  ctx.drawImage(img, 0, 0); }
  list.replaceChildren();
  marks.forEach((mark, i) => {
    const closed = mark.status === 'closed';
    const here = (mark.ref || null) === showing;
    if (cv.width && mark.to && here) {
      ctx.save();
      ctx.strokeStyle = mark.author === 'agent' ? '#2f6fd8' : '#d8442f';
      ctx.lineWidth = Math.max(2, cv.width / 400);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mark.pixel[0], mark.pixel[1]);
      ctx.lineTo(mark.to[0], mark.to[1]);
      ctx.stroke();
      ctx.restore();
      const far = document.createElement('div');
      far.className = 'pin ref end' + (closed ? ' closed' : '')
                      + (mark.author === 'agent' ? ' agent' : '');
      far.style.left = (mark.to[0] / cv.width * 100) + '%';
      far.style.top = (mark.to[1] / cv.height * 100) + '%';
      wrap.appendChild(far);
    }
    if (cv.width && mark.pixel && here) {
      const pin = document.createElement('div');
      pin.className = 'pin' + (closed ? ' closed' : '') + (mark.ref ? ' ref' : '')
                      + (mark.author === 'agent' ? ' agent' : '')
                      + (mark.addressed ? ' done' : '');
      pin.textContent = closed ? '✓' : i + 1;
      pin.style.left = (mark.pixel[0] / cv.width * 100) + '%';
      pin.style.top = (mark.pixel[1] / cv.height * 100) + '%';
      wrap.appendChild(pin);
    }
    const li = document.createElement('li');
    li.className = [closed && 'closed', mark.ref && 'ref',
                    mark.author === 'agent' && 'agent',
                    mark.addressed && 'done'].filter(Boolean).join(' ');
    const view = document.createElement('span');
    view.className = 'view';
    view.textContent = mark.ref || mark.view || '';
    const part = document.createElement('span');
    part.className = 'part';
    part.textContent = mark.part || '';     // marks made before parts existed
    const body = document.createElement('span');
    body.className = 'text';
    body.textContent = mark.text || '';
    li.append(view, ' ', part);
    if (mark.author === 'agent') {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = mark.addressed ? ' agent · addressed' : ' agent';
      li.append(who);
    }
    li.append(document.createElement('br'), body);
    if (!closed) {
      const shut = document.createElement('button');
      shut.className = 'shut';
      shut.textContent = 'close';
      shut.addEventListener('click', () => shutMark(mark));
      li.append(shut);
    }
    list.appendChild(li);
  });
}

// One click, no typing: only the user ever closes a mark.
async function shutMark(mark) {
  const res = await ask('/close', { id: mark.id });
  if (res.ok) { mark.status = 'closed'; draw(); }
}

cv.addEventListener('mousemove', e => {
  if (showing) return;           // a photograph has no parts to name
  const [x, y] = at(e);
  const part = partAt(x, y);
  hint.textContent = part || 'Click the sheet, then type one line.';
});

cv.addEventListener('mousedown', e => { down = showing ? at(e) : null; });

cv.addEventListener('click', e => {
  const [x, y] = at(e);
  const part = showing ? null : partAt(x, y);
  // Far enough to be meant. A hand is not steady on a click, and a span of
  // three pixels is a slip, not a distance the user chose.
  const drag = down && Math.hypot(x - down[0], y - down[1]) > cv.width / 100;
  pending = showing ? { ref: showing, pixel: drag ? down : [x, y] }
                    : { view: viewAt(x, y), pixel: [x, y] };
  if (drag) pending.to = [x, y];
  where.textContent = (showing || pending.view) + (part ? '  ' + part : '')
                      + '  ' + x + ', ' + y
                      + (drag ? '  span ' + Math.round(Math.hypot(x - down[0],
                                                                 y - down[1])) + 'px' : '');
  down = null;
  entry.hidden = false;
  text.value = '';
  text.focus();
});

entry.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pending || !text.value.trim()) return;
  const body = { ...pending, text: text.value.trim() };
  const res = await ask('/marks', body);
  marks.push(await res.json());
  added++;
  pending = null;
  entry.hidden = true;
  draw();
});

// Proof this tab is still on screen. The console ends a run when the beats
// stop, because a closed tab and a tab nobody is looking at differ only in how
// long you wait — and `beforeunload` cannot be relied on to arrive at all. The
// canvas records the beat and acts on nothing, so this costs it a request every
// few seconds and changes none of its behaviour.
const BEAT_MS = 3000;
setInterval(() => { ask('/beat', {}).catch(() => {}); }, BEAT_MS);

// The ending, whichever one this host was left with. Both post `/done`, because
// the server has one way to be told the session is over and the difference is
// what that means: the canvas stops serving, the console ends the run it is
// driving. Selected rather than fetched by id — the other ending is gone, and
// reaching through a capability's element is how a page works for one host and
// throws for the other.
for (const ending of document.querySelectorAll('[data-closed]')) {
  ending.addEventListener('click', async () => {
    await ask('/done', {});
    const said = document.createElement('p');
    said.style.margin = '40px';
    said.textContent = ending.dataset.closed + ' — ' + added + ' mark'
                       + (added === 1 ? '' : 's') + ' captured. You can close this tab.';
    document.body.replaceChildren(said);
  });
}
</script>
